<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Invoice</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFAF7;
    --ink:#26241F;
    --ink-soft:#6b6a63;
    --accent:#33515D;
    --line:#D9D5C9;
    --line-soft:#EDEAE1;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:#EDECE6;
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- toolbar ---------- */
  .toolbar{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:14px 24px;
    background:#1F2421;
    color:#EDEAE1;
  }
  .toolbar h1{
    font-family:'Newsreader', serif;
    font-weight:500;
    font-size:18px;
    margin:0;
    margin-right:auto;
    letter-spacing:0.2px;
  }
  .toolbar label{
    font-size:12.5px;
    display:flex; align-items:center; gap:6px;
    color:#c9c7bd;
  }
  .toolbar input[type=color]{
    width:26px; height:26px; padding:0; border:none; border-radius:6px; cursor:pointer; background:none;
  }
  .btn{
    font-family:inherit;
    font-size:13px;
    font-weight:500;
    padding:8px 16px;
    border-radius:7px;
    border:1px solid transparent;
    cursor:pointer;
    background:var(--accent);
    color:#fff;
  }
  .btn.secondary{
    background:transparent;
    border:1px solid #55534a;
    color:#EDEAE1;
  }
  .btn:hover{filter:brightness(1.08);}

  /* ---------- page ---------- */
  .sheet-wrap{
    padding:36px 16px 80px;
    display:flex;
    justify-content:center;
  }
  .sheet{
    width:100%;
    max-width:800px;
    background:var(--paper);
    padding:56px 56px 48px;
    box-shadow:0 1px 3px rgba(0,0,0,.08), 0 12px 32px rgba(0,0,0,.10);
  }

  input, textarea{
    font-family:inherit;
    color:inherit;
    border:none;
    background:transparent;
    padding:2px 0;
    outline:none;
    width:100%;
  }
  input:focus, textarea:focus, [contenteditable]:focus{
    outline:none;
    box-shadow:0 1px 0 0 var(--accent);
  }
  textarea{resize:none; line-height:1.5;}

  /* ---------- header ---------- */
  .head{
    display:flex;
    justify-content:space-between;
    gap:32px;
    padding-bottom:28px;
    border-bottom:2px solid var(--ink);
  }
  .head > div:first-child{
    flex:1 1 0;
    min-width:0;
  }
  .head-right{
    flex:0 0 auto;
    min-width:150px;
  }
  .brand-name{
    font-family:'Newsreader', serif;
    font-size:27px;
    font-weight:500;
    margin:0 0 6px;
    width:auto;
    min-width:200px;
  }
  .brand-logo{
    height:46px;
    width:auto;
    display:block;
    margin:0 0 12px;
  }
  .brand-line{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .head-right{
    text-align:right;
    flex-shrink:0;
  }
  .invoice-word{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:2.5px;
    color:var(--accent);
    margin-bottom:10px;
  }
  .meta-row{
    display:flex; justify-content:flex-end; gap:8px;
    font-size:13px;
    margin-top:4px;
  }
  .meta-row span.label{
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .meta-row input{
    text-align:right;
    min-width:118px;
  }

  /* ---------- bill to ---------- */
  .parties{
    display:flex;
    justify-content:space-between;
    gap:40px;
    padding:28px 0;
  }
  .party{flex:1;}
  .party .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .party input{
    font-size:14px;
    margin-bottom:4px;
    display:block;
  }
  .party input.name{
    font-weight:600;
    font-size:15px;
  }

  /* ---------- table ---------- */
  table{
    width:100%;
    border-collapse:collapse;
    margin-top:6px;
  }
  thead th{
    text-align:left;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:1.2px;
    color:var(--ink-soft);
    font-weight:500;
    padding:0 0 8px;
    border-bottom:1.5px solid var(--ink);
  }
  th.num, td.num{text-align:right;}
  td{
    padding:11px 0;
    border-bottom:1px solid var(--line-soft);
    vertical-align:top;
    font-size:14px;
  }
  td.desc{width:52%;}
  td.qty, th.qty{width:10%;}
  td.rate, th.rate{width:17%;}
  td.amount, th.amount{width:17%;}
  .amount-val{
    font-variant-numeric:tabular-nums;
    font-weight:500;
  }
  .row-del{
    background:none; border:none; cursor:pointer;
    color:#b5493f; font-size:16px; line-height:1;
    padding:8px 0 0 10px;
    opacity:.55;
  }
  .row-del:hover{opacity:1;}
  td.del-cell{width:24px; padding-left:0;}

  .add-row-btn{
    margin-top:12px;
    background:none;
    border:1px dashed var(--line);
    color:var(--ink-soft);
    font-size:12.5px;
    padding:7px 14px;
    border-radius:6px;
    cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .add-row-btn:hover{border-color:var(--accent); color:var(--accent);}

  /* ---------- totals ---------- */
  .totals{
    display:flex;
    justify-content:flex-end;
    margin-top:18px;
  }
  .totals-box{
    width:260px;
  }
  .totals-line{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13.5px;
    padding:7px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .totals-line .tlabel{color:var(--ink-soft);}
  .totals-line input.tax-input{
    width:44px; text-align:right; display:inline;
  }
  .totals-line.grand{
    border-bottom:none;
    border-top:1.5px solid var(--ink);
    margin-top:2px;
    padding-top:12px;
  }
  .totals-line.grand .tlabel{
    color:var(--ink);
    font-weight:600;
    font-size:14.5px;
  }
  .totals-line.grand .amount-val{
    font-size:19px;
    font-family:'Newsreader', serif;
    font-weight:600;
    color:var(--accent);
  }

  /* ---------- footer ---------- */
  .footer{
    margin-top:40px;
    padding-top:20px;
    border-top:1px solid var(--line);
    display:flex;
    gap:40px;
  }
  .footer .col{flex:1;}
  .footer .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .footer textarea{
    font-size:12.5px;
    color:var(--ink-soft);
    height:60px;
  }

  ::placeholder{color:#b6b3a7;}

  @media print{
    body{background:#fff;}
    .toolbar{display:none;}
    .sheet-wrap{padding:0;}
    .sheet{box-shadow:none; max-width:100%; padding:8mm 10mm;}
    .add-row-btn, .row-del, .del-cell{display:none !important;}
    td.desc{width:56%;}
    input:focus, textarea:focus{box-shadow:none;}
    @page{margin:12mm;}
  }
</style>
</head>

        <div class="brand-line"><input value="Colas Yard, Bluebell Industrial Estate, Bluebell" placeholder="Address"></div>
        <div class="brand-line"><input value="Dublin 12, D12 DR4R" placeholder="City, Eircode"></div>
        <div class="brand-line"><input value="info@evolutionrecycling.ie · 085-1938556" placeholder="Email · Phone"></div>
      </div>
      <div class="head-right">
        <div class="invoice-word">INVOICE</div>
        <div class="meta-row"><span class="label">No.</span><input value="0001"></div>
        <div class="meta-row"><span class="label">Date</span><input type="date" id="invDate"></div>
        <div class="meta-row"><span class="label">Due</span><input type="date" id="dueDate"></div>
      </div>
    </div>

    <div class="parties">
      <div class="party">
        <div class="tag">BILL TO</div>
        <input class="name" value="Client Name" placeholder="Client name">
        <input value="Client address" placeholder="Address">
        <input value="client@email.com" placeholder="Email">
      </div>
      <div class="party" style="text-align:right;">
        <div class="tag">REFERENCE</div>
        <input style="text-align:right;" value="INV-0001" placeholder="Reference">
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th class="desc">DESCRIPTION</th>
          <th class="qty num">QTY</th>
          <th class="rate num">RATE €</th>
          <th class="amount num">AMOUNT €</th>
          <th class="del-cell"></th>
        </tr>
      </thead>
      <tbody id="lineItems"></tbody>
    </table>

    <button class="add-row-btn no-print" id="addRow">+ Add line</button>

    <div class="totals">
      <div class="totals-box">
        <div class="totals-line">
          <span class="tlabel">Subtotal</span>
          <span class="amount-val" id="subtotal">€0.00</span>
        </div>
        <div class="totals-line">
          <span class="tlabel">Tax <input class="tax-input" id="taxRate" value="0" type="number" min="0" step="0.5">%</span>
          <span class="amount-val" id="taxAmount">€0.00</span>
        </div>
        <div class="totals-line grand">
          <span class="tlabel">Total</span>
          <span class="amount-val" id="grandTotal">€0.00</span>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="col">
        <div class="tag">NOTES</div>
        <textarea placeholder="Thank you for your business.">Thank you for your business.</textarea>
      </div>
      <div class="col">
        <div class="tag">TERMS</div>
        <textarea placeholder="Payable within 14 days.">Payable within 14 days.</textarea>
      </div>
    </div>

  </div>
</div>

<script>
const tbody = document.getElementById('lineItems');
const accentPicker = document.getElementById('accentPicker');

function fmt(n){
  return '€' + (Math.round((n + Number.EPSILON) * 100) / 100).toLocaleString('en-IE', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function recalc(){
  let subtotal = 0;
  tbody.querySelectorAll('tr').forEach(row => {
    const qty = parseFloat(row.querySelector('.in-qty').value) || 0;
    const rate = parseFloat(row.querySelector('.in-rate').value) || 0;
    const amount = qty * rate;
    row.querySelector('.amount-val').textContent = fmt(amount);
    subtotal += amount;
  });
  const taxRate = parseFloat(document.getElementById('taxRate').value) || 0;
  const taxAmount = subtotal * (taxRate / 100);
  const total = subtotal + taxAmount;
  document.getElementById('subtotal').textContent = fmt(subtotal);
  document.getElementById('taxAmount').textContent = fmt(taxAmount);
  document.getElementById('grandTotal').textContent = fmt(total);
}

function addRow(desc, qty, rate){
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td class="desc"><input class="in-desc" value="${desc ?? ''}" placeholder="Item description"></td>
    <td class="qty num"><input class="in-qty" type="number" min="0" step="1" value="${qty ?? 1}"></td>
    <td class="rate num"><input class="in-rate" type="number" min="0" step="0.01" value="${rate ?? 0}"></td>
    <td class="amount num"><span class="amount-val">€0.00</span></td>
    <td class="del-cell no-print"><button class="row-del" title="Remove line">×</button></td>
  `;
  tbody.appendChild(tr);
  tr.querySelectorAll('.in-qty, .in-rate').forEach(el => el.addEventListener('input', recalc));
  tr.querySelector('.row-del').addEventListener('click', () => { tr.remove(); recalc(); });
  recalc();
}

document.getElementById('addRow').addEventListener('click', () => addRow());
document.getElementById('taxRate').addEventListener('input', recalc);

document.getElementById('printBtn').addEventListener('click', () => window.print());

document.getElementById('resetBtn').addEventListener('click', () => {
  if(confirm('Clear all fields and start a fresh invoice?')) location.reload();
});

accentPicker.addEventListener('input', (e) => {
  document.documentElement.style.setProperty('--accent', e.target.value);
});

// default dates: today + 14 days
const today = new Date();
const due = new Date(today); due.setDate(due.getDate() + 14);
document.getElementById('invDate').value = today.toISOString().slice(0,10);
document.getElementById('dueDate').value = due.toISOString().slice(0,10);

// seed with three blank starter rows
addRow('', 1, 0);
addRow('', 1, 0);
addRow('', 1, 0);
</script>

</body>
